name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trackr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # setup.mjs reads this; JWT_SECRET is auto-set by setup.mjs when absent.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/trackr_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Apply migrations to the test database
        working-directory: backend
        run: npm run test:db

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Dependency audit (non-blocking)
        working-directory: backend
        run: npm audit --audit-level=high || true

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install dependencies
        working-directory: frontend-angular
        run: npm ci

      - name: Build
        working-directory: frontend-angular
        run: npm run build

      - name: Dependency audit (non-blocking)
        working-directory: frontend-angular
        run: npm audit --audit-level=high || true
